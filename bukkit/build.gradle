plugins {
    id 'com.gradleup.shadow' version '9.6.1'
}

repositories {
    maven { url = "https://libraries.minecraft.net/" }
    maven { url = "https://repo.helpch.at/releases/" }
    maven { url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/" }
}

dependencies {
    implementation project(":core")
    compileOnly("io.netty:netty-all:4.2.7.Final")
    compileOnly("org.spigotmc:spigot-api:26.1.1-R0.1-SNAPSHOT")
    testImplementation("org.spigotmc:spigot-api:26.1.1-R0.1-SNAPSHOT")
    compileOnly("me.clip:placeholderapi:2.11.5")
}

shadowJar {
    dependencies {
        include(dependency("io.github.gonalez.znpcs:.*"))
        // Not provided by the server.
        include(dependency("com.ryanharter.auto.value:auto-value-gson-runtime:.*"))
        include(dependency("io.sweers.autotransient:autotransient:.*"))
    }
}