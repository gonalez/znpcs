plugins {
    id 'java-library'
}

repositories {
    maven { url = "https://libraries.minecraft.net/" }
}

dependencies {
    api("com.google.code.gson:gson:2.8.9")
    api("com.google.guava:guava:31.0-jre")
    api("org.yaml:snakeyaml:1.26")
    api("com.mojang:authlib:1.5.21")
    api("com.mojang:datafixerupper:3.0.25")

    api("com.google.auto.value:auto-value-annotations:1.11.0")
    annotationProcessor("com.google.auto.value:auto-value:1.11.0")

    api("com.ryanharter.auto.value:auto-value-gson-runtime:1.3.1")
    annotationProcessor("com.ryanharter.auto.value:auto-value-gson-extension:1.3.1")
}